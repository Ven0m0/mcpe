repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: node-check
        name: node --check
        entry: node --check
        language: system
        files: \.js$

      - id: oxlint
        name: oxlint
        entry: bunx oxlint
        language: system
        files: \.js$
        pass_filenames: false

      - id: oxfmt
        name: oxfmt --check
        entry: bunx oxfmt --check
        language: system
        files: \.js$
