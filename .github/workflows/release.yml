name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build mcaddon
        run: zip -r ender_chest_drop.mcaddon ender_chest_drop
      - uses: softprops/action-gh-release@v3
        with:
          files: ender_chest_drop.mcaddon
