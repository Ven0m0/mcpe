name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run format:check
      - name: node --check all scripts
        run: git ls-files '*.js' | xargs -r -n1 node --check
      - name: JSON syntax check
        run: git ls-files '*.json' | xargs -r -n1 python3 -c "import json,sys; json.load(open(sys.argv[1]))"
      - name: validate behavior pack manifests
        run: python3 scripts/validate_packs.py

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install prek
      - run: prek run --all-files
